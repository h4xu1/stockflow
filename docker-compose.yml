services:
  postgres:
    image: postgres:15
    container_name: buisness
    restart: always
    environment:
      POSTGRES_USER: islamdin
      POSTGRES_PASSWORD: wannapoopbro
      POSTGRES_DB: ranobe
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_app
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: isla@isla.com
      PGADMIN_DEFAULT_PASSWORD: islampc201rahmatu
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data:
